name: 上游版本监控

# Polls missuo/koe for a new release tag and, when one appears, rebuilds the
# Chinese branch and starts the build.
#
# How the build gets started
# --------------------------
# A push made with the automatic GITHUB_TOKEN does not start other workflows:
# "other GITHUB_TOKEN-triggered events do not create workflow runs at all".
# `workflow_dispatch` is explicitly exempt from that rule, so this workflow
# pushes the rebuilt branch and then dispatches 中文版构建 (zh-release.yml)
# against it. One definition of the build, two ways to reach it.
#
# Why a heartbeat commit
# ----------------------
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. Upstream releasing counts as activity on THEIR
# repository, not on this fork, so a quiet period could silently switch the
# watcher off. The heartbeat keeps it enabled and makes "last successful check"
# visible in the history. If it does get disabled, re-enable it from the Actions
# tab; the manual button always works.
on:
  schedule:
    # Upstream releases roughly every two weeks, so a few checks a day is plenty.
    # Off the hour to avoid GitHub's documented high-load window.
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zh-upstream-watch
  cancel-in-progress: false

jobs:
  sync:
    name: 检查上游版本并重建
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.compare.outputs.updated }}
      tag: ${{ steps.compare.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: zh-tooling

      - name: Compare upstream tags
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM=missuo/koe
          FORK="$GITHUB_REPOSITORY"

          NEWEST=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          echo "newest upstream release: $NEWEST"
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"

          # zh is always "<upstream tag> + one localization commit", so the tag
          # it was built on is the parent of its head commit. Upstream's tags are
          # lightweight commits, so a direct SHA comparison against the tag list
          # is enough — no clone or fetch needed.
          BASE_SHA=$(gh api "repos/$FORK/commits/zh" --jq '.parents[0].sha' 2>/dev/null || echo "")
          BASE_TAG=""
          if [ -n "$BASE_SHA" ]; then
            BASE_TAG=$(gh api "repos/$UPSTREAM/git/refs/tags" --paginate \
              --jq ".[] | select(.object.sha == \"$BASE_SHA\") | .ref" \
              | sed 's|^refs/tags/||' | head -1)
          fi
          echo "zh branch currently built on: ${BASE_TAG:-(unknown)}"

          if [ "$NEWEST" = "$BASE_TAG" ]; then
            echo "up to date"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "a new release is available: $NEWEST"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "tag=$NEWEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Heartbeat
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .watch
          {
            echo "last_check: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "newest_upstream: ${{ steps.compare.outputs.tag || 'unknown' }}"
            echo "updated: ${{ steps.compare.outputs.updated }}"
          } > .watch/last-check
          git add .watch/last-check
          git commit -qm "chore(watch): upstream check $(date -u +%Y-%m-%d)" || true
          git push origin HEAD:zh-tooling || true

      - name: Rebuild the Chinese branch
        if: steps.compare.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A fresh checkout has only 'origin' (the fork). Add upstream so the
          # sync can fetch the new tag, then push zh back to the fork.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/missuo/koe.git
          git fetch --no-tags upstream --tags

          # The runner cannot reach the local translation gateway (it lives on a
          # workstation), so --allow-untranslated leaves any newly added English
          # strings in place instead of refusing to build. Running
          # tools/zh/sync.py locally afterwards translates them properly.
          python3 tools/zh/sync.py \
            --tag "${{ steps.compare.outputs.tag }}" \
            --upstream upstream \
            --target origin \
            --allow-untranslated \
            --force

      - name: Start the build
        if: steps.compare.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # workflow_dispatch is exempt from the GITHUB_TOKEN recursion rule that
          # stops a bot push from triggering workflows.
          gh workflow run zh-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref zh
          echo "dispatched 中文版构建 against zh@${{ steps.compare.outputs.tag }}"
